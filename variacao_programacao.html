function fmtNum(n) { return Math.round(n).toLocaleString('pt-BR'); }
function fmtSigned(n) {
  const s = Math.round(n).toLocaleString('pt-BR');
  return n > 0 ? '+' + s : s;
}
function arrowCell(de, a) {
  if (de === a) return `<span class="arrow-cell"><span class="same">${fmtNum(de)}</span></span>`;
  const cls = a > de ? 'up' : 'down';
  const symbol = a > de ? '&#9650;' : '&#9660;';
  return `<span class="arrow-cell">${fmtNum(de)} &rarr; <span class="${cls}">${fmtNum(a)} ${symbol}</span></span>`;
}

function initWeekSelect() {
  const sel = document.getElementById('weekSelect');
  sel.innerHTML = PAYLOAD.week_labels.map(w => `<option value="${w}">${w}</option>`).join('');
  sel.value = PAYLOAD.week_labels[PAYLOAD.week_labels.length - 1];
}

function initMetaBar() {
  const meta = PAYLOAD.meta;
  document.getElementById('metaBar').innerHTML = `
    <div>Ventana: <b>${meta.lookback_days} dias</b> de historial de releases</div>
    <div>PNs en la ventana: <b>${meta.n_pns}</b></div>
    <div>Gerado: <b>${meta.generated_at}</b></div>
  `;
}

function renderWeek(week) {
  const data = PAYLOAD.semanas[week];
  if (!data) return;
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="summary-grid">
      <div class="summary-card">
        <div class="label">PN que variaram (${week})</div>
        <div class="value">${data.n_pn_variaram}</div>
      </div>
      <div class="summary-card">
        <div class="label">Variação Firm total</div>
        <div class="value ${data.var_firm_total > 0 ? 'pos' : (data.var_firm_total < 0 ? 'neg' : '')}">${fmtSigned(data.var_firm_total)}</div>
      </div>
      <div class="summary-card">
        <div class="label">Variação Past Due total</div>
        <div class="value ${data.var_past_due_total > 0 ? 'pos' : (data.var_past_due_total < 0 ? 'neg' : '')}">${fmtSigned(data.var_past_due_total)}</div>
      </div>
    </div>
    <div class="card">
      <h2>
        <span>Detalhe por PN (release ${data.release_anterior} &rarr; ${data.release_actual})</span>
        <input id="pnSearch" placeholder="Buscar PN ou fornecedor..." oninput="filterRows(this.value)">
      </h2>
      <table id="pnTable">
        <thead>
          <tr>
            <th>PN</th><th>Fornecedor</th><th>Firm (De &rarr; A)</th><th>Past Due (De &rarr; A)</th>
          </tr>
        </thead>
        <tbody id="pnTableBody"></tbody>
      </table>
      <div class="empty" id="emptyMsg" style="display:none">Nenhum PN encontrado.</div>
    </div>
  `;
  renderRows(data.rows);
}

function renderRows(rows) {
  const tbody = document.getElementById('pnTableBody');
  if (!rows.length) {
    tbody.innerHTML = '';
    document.getElementById('emptyMsg').style.display = 'block';
    return;
  }
  document.getElementById('emptyMsg').style.display = 'none';
  tbody.innerHTML = rows.map(r => `
    <tr data-search="${(r.pn + ' ' + r.supplier_code + ' ' + r.supplier_name).toLowerCase()}">
      <td class="pn">${r.pn}</td>
      <td>${r.supplier_name ? r.supplier_name + ' (' + r.supplier_code + ')' : (r.supplier_code || '-')}</td>
      <td>${arrowCell(r.firm_de, r.firm_a)}</td>
      <td>${arrowCell(r.pd_de, r.pd_a)}</td>
    </tr>
  `).join('');
}

function filterRows(q) {
  q = q.trim().toLowerCase();
  const rows = document.querySelectorAll('#pnTableBody tr');
  let visible = 0;
  rows.forEach(tr => {
    const match = !q || tr.dataset.search.includes(q);
    tr.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('emptyMsg').style.display = visible ? 'none' : 'block';
}

initWeekSelect();
renderWeek(document.getElementById('weekSelect').value);
