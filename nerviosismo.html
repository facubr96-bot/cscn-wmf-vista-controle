function setSort(mode) {
  sortMode = mode;
  document.getElementById('btnPct').classList.toggle('active', mode === 'pct');
  document.getElementById('btnAbs').classList.toggle('active', mode === 'abs');
  renderRanking();
}

function sortedSuppliers() {
  const arr = [...PAYLOAD.suppliers];
  if (sortMode === 'pct') {
    arr.sort((a, b) => (b.pct_total ?? -1) - (a.pct_total ?? -1));
  } else {
    arr.sort((a, b) => b.total_movimiento - a.total_movimiento);
  }
  return arr.slice(0, 25);
}

function renderRanking() {
  const arr = sortedSuppliers();
  const ctx = document.getElementById('rankingChart').getContext('2d');
  const labels = arr.map(s => s.supplier_code);
  const values = arr.map(s => sortMode === 'pct' ? (s.pct_total ?? 0) : s.total_movimiento);
  if (rankingChart) rankingChart.destroy();
  rankingChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label: sortMode === 'pct' ? '% Nerviosismo' : 'Movimiento Total (unid)', data: values, backgroundColor: '#1F3864' }] },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: { legend: { display: false } },
      onClick: (evt, elements) => {
        if (!elements.length) return;
        const sup = arr[elements[0].index];
        selectSupplier(sup.supplier_code);
      },
      scales: { x: { beginAtZero: true } },
    },
  });
}

}

function bucketCells(item) {
  if (!item) return '<td>-</td><td>-</td><td>-</td><td>-</td>';
  const pctHtml = item.categoria === 'Nuevo'
    ? '<span class="cat-nuevo">NOVO</span>'
    : `<span class="pct-badge ${pctClass(item.pct)}">${pctLabel(item.pct)}</span>`;
  return `<td>${fmtNum(item.base)}</td><td>${fmtNum(item.entrada)}</td><td>${fmtNum(item.salida)}</td><td>${pctHtml}</td>`;
}

function renderPnTable() {
  if (!selectedSupplier) return;
  const q = (document.getElementById('pnSearch').value || '').trim().toLowerCase();
  const rows = pnRowsForSupplier(selectedSupplier).filter(r => !q || r.pn.toLowerCase().includes(q));
  const table = document.getElementById('pnTable');
  table.querySelector('thead').innerHTML = `<tr>
    <th>PN</th><th colspan="4">Past Due</th><th colspan="4">Firm</th>
  </tr><tr>
    <th></th><th>Base</th><th>Entrada</th><th>Salida</th><th>%</th>
    <th>Base</th><th>Entrada</th><th>Salida</th><th>%</th>
  </tr>`;
  table.querySelector('tbody').innerHTML = rows.map(r => `<tr>
    <td>${r.pn}</td>${bucketCells(r['Past Due'])}${bucketCells(r['Firm'])}
  </tr>`).join('') || '<tr><td colspan="9" style="text-align:center;color:#aaa;padding:20px">Nenhum PN encontrado</td></tr>';
}

function renderTrend() {
  const ctx = document.getElementById('trendChart').getContext('2d');
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(ctx, {
    type: 'line',
    data: { labels: PAYLOAD.trend.labels, datasets: [{ label: 'Total Past Due + Firm (todos os fornecedores)', data: PAYLOAD.trend.global, borderColor: '#1F3864', backgroundColor: 'rgba(31,56,100,.1)', fill: true, tension: .25 }] },
    options: { responsive: true, plugins: { legend: { display: true } }, scales: { y: { beginAtZero: true } } },
  });
}

function renderFullTable() {
  const q = (document.getElementById('fullSearch').value || '').trim().toLowerCase();
  const rows = PAYLOAD.pn_rows.filter(r => !q || r.pn.toLowerCase().includes(q) || r.supplier_code.toLowerCase().includes(q));
  const table = document.getElementById('fullTable');
  table.querySelector('thead').innerHTML = `<tr>
    <th>PN</th><th>Fornecedor</th><th colspan="4">Past Due</th><th colspan="4">Firm</th>
  </tr><tr>
    <th></th><th></th><th>Base</th><th>Entrada</th><th>Salida</th><th>%</th>
    <th>Base</th><th>Entrada</th><th>Salida</th><th>%</th>
  </tr>`;
  table.querySelector('tbody').innerHTML = rows.slice(0, 500).map(r => `<tr>
    <td>${r.pn}</td><td>${r.supplier_code}</td>${bucketCells(r['Past Due'])}${bucketCells(r['Firm'])}
  </tr>`).join('') + (rows.length > 500 ? `<tr><td colspan="10" style="text-align:center;color:#aaa;padding:10px">Mostrando 500 de ${rows.length} - use a busca ou exporte CSV para ver todos</td></tr>` : '');
}

function exportCsv() {
  const headers = ['PN', 'Supplier Code', 'Supplier Name', 'PD Base', 'PD Entrada', 'PD Salida', 'PD Salida Recepcion', 'PD Salida Reprog', 'PD %', 'PD Categoria',
    'Firm Base', 'Firm Entrada', 'Firm Salida', 'Firm Salida Recepcion', 'Firm Salida Reprog', 'Firm %', 'Firm Categoria'];
  const supByCode = Object.fromEntries(PAYLOAD.suppliers.map(s => [s.supplier_code, s.supplier_name]));
  const lines = [headers.join(';')];
  PAYLOAD.pn_rows.forEach(r => {
    const cells = [r.pn, r.supplier_code, supByCode[r.supplier_code] || ''];
    ['Past Due', 'Firm'].forEach(b => {
      const it = r[b];
      if (!it) { cells.push(0, 0, 0, 0, 0, '', 'Sin datos'); return; }
      cells.push(Math.round(it.base), Math.round(it.entrada), Math.round(it.salida), Math.round(it.salida_recepcion),
        Math.round(it.salida_reprog), it.pct !== null ? it.pct.toFixed(1) : '', it.categoria);
    });
    lines.push(cells.join(';'));
  });
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'nerviosismo_detalle.csv';
  a.click();
  URL.revokeObjectURL(url);
}

init();
</script>
